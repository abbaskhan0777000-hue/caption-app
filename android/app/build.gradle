plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captionforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.captionforge.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'lib/**/libavcodec.so'
        pickFirst 'lib/**/libavfilter.so'
        pickFirst 'lib/**/libavformat.so'
        pickFirst 'lib/**/libavutil.so'
        pickFirst 'lib/**/libswresample.so'
        pickFirst 'lib/**/libswscale.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    
    // Native Hardware C++ Video Engine (FFmpegKit with Full Subtitle & Hardware Codecs)
    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'
}
