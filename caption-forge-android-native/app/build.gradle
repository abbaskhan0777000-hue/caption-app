plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captionforge.nativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.captionforge.studio"
        minSdk 24
        targetSdk 34
        versionCode 29
        versionName "1.5.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'lib/**/libavcodec.so'
        pickFirst 'lib/**/libavfilter.so'
        pickFirst 'lib/**/libavformat.so'
        pickFirst 'lib/**/libavutil.so'
        pickFirst 'lib/**/libswresample.so'
        pickFirst 'lib/**/libswscale.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX & Material Design
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Native ExoPlayer (Instant 0-lag video playback)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // High-Speed Direct Network Engine (Groq Whisper)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Native C++ FFmpegKit (Full subtitle & hardware codecs)
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-full:7.1.5'
}
