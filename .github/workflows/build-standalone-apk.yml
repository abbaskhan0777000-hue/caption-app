name: Build Standalone Pure Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🚀 Build Standalone Pure Native APK (ExoPlayer + Hardware FFmpeg)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: ⚡ Build Standalone Native APK
        run: |
          cd caption-forge-android-native
          gradle assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload Standalone Pure Native APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptionForge-PureNative-App
          path: caption-forge-android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
