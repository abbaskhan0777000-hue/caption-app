name: Build Android APK (Cloud Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🚀 Build Native Android APK with Hardware FFmpeg
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js & Build Web Studio Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔨 Compile CaptionForge Studio
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets/web
          cp -r out/* android/app/src/main/assets/web/

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: ⚡ Build Android APK with Native C++ FFmpegKit
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptionForge-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
