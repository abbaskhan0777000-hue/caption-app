name: Build Android APK (Cloud Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🚀 Build Native Android APK with Hardware FFmpeg
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 🛠️ Install NPM Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🏗️ Build Static Web Assets
        run: npm run build

      - name: 🔑 Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew || true

      - name: ⚡ Build Android APK with Native C++ FFmpegKit
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptionForge-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
